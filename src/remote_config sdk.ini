[Vehicle]
# 车长、车宽、车高，单位mm, 105(9260*3980*4350), 130(10416*4630*5150)
length = 9260
width = 3980
height = 4350
[Camera]
# 相机高度，单位mm, 105(2600), 130(1960)
height = 2600
# 车前盲区距离，单位mm, 105(2400), 130(3000)
blindDist = 2400
# 相机俯仰角（度）, 105(80), 130(80)
pitchDegree = 80
[Audio]
# 音频, 中信科设备具备此功能
isOpen = 0
# 是否保存
isSaved = 0
[DumpBack]
# 是否打开排土场倒车安全策略
dumpBack_isOpen = 1
# 重载倒车扭矩限制基准值、遥控未使用
full_back_throttle_limit = 34.0f
# 坡度油门系数
slope_throttle_compensation = 1.0f
# 抵墙卸料转角补偿系数
dev_angle_throttle_compensation = 1.0f
# 倒车扭矩最大限制值
vehile_back_throttle_max = 52.0f

#/* ----------俯仰角异常 阈值参数（静态或配置） ---------- */
pitch_pair_chang_value  = 1.5f; 
up_level_pitch_max      = 3.5f; 
down_level_pitch_max    = 1.6f; 