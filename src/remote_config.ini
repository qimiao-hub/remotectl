[DumpBack]
# 是否打开排土场倒车安全策略
dumpBack_isOpen = 1

# ---------- 倒车边界停车参数（静态或配置） ---------- 
boundary_stop_without_curb_dis = 3.0f # 挡墙数据无效时，边界停车距离
boundary_curb_diff_dis = 4.0f # 边界距离、挡墙距离的差异冗余，即挡墙距离有效的冗余
curb_stop_dis = 1.9f    # 挡墙数据有效，连续5帧过近停车距离
boundary_stop_with_curb_dis = 1.2f  # 挡墙数据有效时，边界停车距离

# ---------- 油门补偿参数（静态或配置） ---------- 
full_back_throttle_limit = 45.0f    # 重载倒车扭矩限制基准值
slope_throttle_compensation = 2.0f  # 坡度油门系数
dev_angle_throttle_compensation = 1.0f  # 抵墙卸料转角补偿系数
vehile_back_throttle_max = 52.0f    # 倒车扭矩最大限制值

# ----------俯仰角异常 阈值参数（静态或配置） ---------- 
top_level_pitch_limit = 1.0f        # 二次起步判断高于俯仰角基准限值
low_level_pitch_limit = 0.8f           #二次起步判断低于俯仰角基准限值
pitch_abnormal_dis = 2.0f           # 检测俯仰角异常的距离阈值
pitch_pair_chang_value  = 0.5f      # 俯仰角波动异常阈值
up_level_pitch_max      = 3.5f      # 上仰异常阈值
down_level_pitch_max    = 1.6f      # 下降异常阈值